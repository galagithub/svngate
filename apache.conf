# ============================================================
# Apache modules
# ============================================================

LoadModule dav_module /usr/lib/apache2/mod_dav.so
LoadModule dav_svn_module /usr/lib/apache2/mod_dav_svn.so
LoadModule authz_svn_module /usr/lib/apache2/mod_authz_svn.so


# ============================================================
# Global settings
# ============================================================

ServerName localhost

DirectoryIndex index.php index.html

TypesConfig /etc/apache2/mime.types


# ============================================================
# WebSVN
#
# PUBLIC FOR NOW
#
# Authentication can be added here later.
# ============================================================

Alias /websvn /var/www/websvn

<Directory /var/www/websvn>

    Options FollowSymLinks

    AllowOverride All

    DirectoryIndex index.php

    Require all granted

</Directory>

#
# IMPORTANT:
#
# WebSVN authentication is intentionally disabled for now.
#
# When we want to protect WebSVN, authentication should be
# configured here / through WebSVN's authentication mechanism.
#
# Do NOT put:
#
#     Require valid-user
#
# here yet.


# ============================================================
# PUBLIC SVN REPOSITORY LIST
# ============================================================

<Location /svn>

    DAV svn

    SVNParentPath /var/svn

    SVNListParentPath On

    Require all granted

</Location>


# ============================================================
# HTTP virtual host
# ============================================================

<VirtualHost *:80>

    ServerName localhost

    DocumentRoot /var/www

    # WebSVN
    Alias /websvn /var/www/websvn

    <Directory /var/www/websvn>

        Options FollowSymLinks

        AllowOverride All

        DirectoryIndex index.php

        Require all granted

    </Directory>


    # --------------------------------------------------------
    # PUBLIC SVN LIST
    # --------------------------------------------------------

    <Location /svn>

        DAV svn

        SVNParentPath /var/svn

        SVNListParentPath On

        Require all granted

    </Location>


    # --------------------------------------------------------
    # Repository-specific locations
    #
    # Generated automatically by entrypoint.sh
    # --------------------------------------------------------

    IncludeOptional /etc/apache2/svn-repositories.conf

</VirtualHost>

